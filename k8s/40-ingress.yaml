# ------------------------------------------------------------------
# Ingress: creates ONE public AWS Application Load Balancer (ALB)
# that routes by path to the three services.
# The AWS Load Balancer Controller watches this object and builds the ALB.
# ------------------------------------------------------------------
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: quickcart
  namespace: quickcart
  labels:
    app.kubernetes.io/part-of: quickcart
  annotations:
    alb.ingress.kubernetes.io/load-balancer-name: quickcart-alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}]'
spec:
  ingressClassName: alb
  rules:
    - http:
        paths:
          - path: /api/products
            pathType: Prefix
            backend:
              service:
                name: product-service
                port:
                  number: 80
          - path: /api/orders
            pathType: Prefix
            backend:
              service:
                name: order-service
                port:
                  number: 80
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
