# ------------------------------------------------------------------
# frontend: the web page users see (nginx)
# ------------------------------------------------------------------
# ConfigMap: shop name and banner. Mounted into nginx as config.json.
# Change the banner here, push, and it is live - no image rebuild.
apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend-config
  namespace: quickcart
  labels:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/part-of: quickcart
data:
  config.json: |
    {
      "shopName": "QuickCart",
      "banner": "Welcome to QuickCart - deployed by Argo CD",
      "currency": "Rs."
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: quickcart
  labels:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/part-of: quickcart
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: frontend
        app.kubernetes.io/part-of: quickcart
    spec:
      containers:
        - name: frontend
          # The CI pipeline updates this tag after every build.
          image: discoverdevops/quickcart-frontend:dab3e108caf1313d885fe79f262b7e1f2c8d5186
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: config
              mountPath: /usr/share/nginx/html/config
          readinessProbe:
            httpGet: { path: /, port: 8080 }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /, port: 8080 }
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 200m, memory: 128Mi }
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
      volumes:
        - name: config
          configMap:
            name: frontend-config
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: quickcart
  labels:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/part-of: quickcart
  annotations:
    alb.ingress.kubernetes.io/healthcheck-path: /
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: frontend
  ports:
    - port: 80
      targetPort: 8080
