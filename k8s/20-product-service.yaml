# ------------------------------------------------------------------
# product-service: the product catalog (Python FastAPI)
# ------------------------------------------------------------------
# ConfigMap: the catalog itself. Change a price here, push,
# and the shop shows the new price within a minute - no rebuild.
apiVersion: v1
kind: ConfigMap
metadata:
  name: product-catalog
  namespace: quickcart
  labels:
    app.kubernetes.io/name: product-service
    app.kubernetes.io/part-of: quickcart
data:
  products.json: |
    [
      {"id": 1, "name": "GitOps T-Shirt", "price": 499},
      {"id": 2, "name": "Kubernetes Mug", "price": 299},
      {"id": 3, "name": "Argo CD Sticker Pack", "price": 99},
      {"id": 4, "name": "DevOps Hoodie", "price": 1299}
    ]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: product-service
  namespace: quickcart
  labels:
    app.kubernetes.io/name: product-service
    app.kubernetes.io/part-of: quickcart
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: product-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: product-service
        app.kubernetes.io/part-of: quickcart
    spec:
      containers:
        - name: product-service
          # The CI pipeline updates this tag after every build.
          image: discoverdevops/quickcart-product-service:latest
          ports:
            - containerPort: 8000
          env:
            - name: CATALOG_FILE
              value: /config/products.json
          volumeMounts:
            - name: catalog
              mountPath: /config
          readinessProbe:
            httpGet: { path: /api/products/health, port: 8000 }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /api/products/health, port: 8000 }
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests: { cpu: 50m, memory: 96Mi }
            limits: { cpu: 300m, memory: 192Mi }
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
      volumes:
        - name: catalog
          configMap:
            name: product-catalog
---
apiVersion: v1
kind: Service
metadata:
  name: product-service
  namespace: quickcart
  labels:
    app.kubernetes.io/name: product-service
    app.kubernetes.io/part-of: quickcart
  annotations:
    alb.ingress.kubernetes.io/healthcheck-path: /api/products/health
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: product-service
  ports:
    - port: 80
      targetPort: 8000
